# PR 화면에 통과 여부를 남긴다. 사용자는 게이트가 아니라 독자이고, 이 체크가 그 창구를
# 완성한다 (운영계획 §3.3).
#
# 성능은 여기서 재지 않는다 (PERF-OWN-R3). 초록 체크가 단언하는 것은 "빌드가 서고 테스트가
# 돈다"뿐인데, 성능 스텝을 끼우면 리뷰어에게 "성능 확인됨"으로 읽힌다. 실측이 흔들리는 것도
# 근거다 — 5회 중 1회 1,932ms / 중앙값 1,288ms. flaky 한 게이트는 두 번째 빨간불부터
# 무시당한다. 성능 판정은 라운드/Phase 경계에서 tester 가 하네스로 한다.
#
# wp-env 도 띄우지 않는다 (운영계획 §4.3). "느리다"가 실측 없이 적혀 있었는데
# (PR2-SMOKE §4), 재 보니 콜드 ~60분 / 웜 ~1분이다. 저장소 자체가 20GB인 게 아니다 —
# wp-env가 development 환경에도 wordpress-develop의 PHPUnit 스위트를 받는데
# (depth 1 + blob:none + sparse로 걸어도) .git이 20GB로 불어나고, 인스턴스당 두 벌(tests
# 쪽도) 40GB다. 우리는 PHPUnit을 안 돌린다 — testsEnvironment: false는 tests 쪽만 막고
# development 쪽은 못 막는다(SMOKE-CAUSE, architect). 원인은 고칠 수 있는 결함일 가능성이
# 있지만 Phase 3 범위 밖이라 씨앗으로만 남긴다. GH Actions 러너는 항상 콜드이므로
# 결론은 그대로다: "CI 편입 불가"가 아니라 "이 클론을 캐시하지 않고는 불가" — 지금은 그
# 캐시가 없다. `npm run smoke`는 로컬/사람이 진다 — PR 템플릿 "L2 도달" 칸.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 패치까지 박지 않는다. 박으면 우리가 안 돌려본 조합을 고정하게 된다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 어느 조합에서 통과했는지가 로그에 남아야 한다.
      - name: versions
        run: node -v && npm -v

      # npm install 이 아니라 npm ci 다. lock 을 그대로 쓴다 — 이슈 #3 이
      # "설치가 성공으로 보이는 것을 성공으로 읽어서" 났다.
      - run: npm ci

      - run: npm run build

      - run: npm test

      # 테마 번들은 커밋된 산출물이다. 소스만 고치고 다시 빌드하지 않으면 둘이 갈라지는데
      # 화면은 멀쩡히 뜬다 — 옛 번들이 실릴 뿐이다. 여기서 다시 빌드해 diff 로 잡는다.
      - run: npm run build:theme
      - name: theme bundle is up to date
        # git diff 가 아니라 status 로 본다 — diff 는 추적되지 않는 새 파일을 못 본다.
        # 산출물이 하나 늘어나는 형태가 그 구멍으로 새면 커밋 안 된 자산이 배포에서 빠진다.
        run: |
          dirty=$(git status --porcelain -- theme/artpsy/assets)
          if [ -n "$dirty" ]; then
            echo "테마 번들이 소스와 다르다. npm run build:theme 을 돌리고 커밋할 것."
            echo "$dirty"
            git diff -- theme/artpsy/assets | head -40
            exit 1
          fi

      # 판정이 아니라 출력만이다 — exit 1 을 넣지 않는다. 초록 체크가 "성능 확인됨"으로
      # 읽히면 안 된다는 원칙(위 PERF-OWN-R3)은 그대로다. 다만 안 재면 Phase 4 에서
      # "어디서 늘었나"를 이분 탐색할 수 없다 — 그래서 회차마다 로그에만 남긴다.
      - name: theme bundle byte sizes (판정 없음)
        run: |
          echo "파일별:"
          find theme/artpsy/assets -type f -exec du -b {} \; | sort -k2
          echo "합계:"
          find theme/artpsy/assets -type f -exec du -b {} \; | awk '{sum += $1} END {print sum " bytes"}'
